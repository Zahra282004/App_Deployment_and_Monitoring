apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: app-vpa
  namespace: 3-tier-app
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: StatefulSet
    name: db-statefulset
  updatePolicy:
    updateMode: "Recreate"
  resourcePolicy:
    containerPolicies:
    - containerName: "db-cont"
      minAllowed:
        cpu: 100m
        memory: 128Mi
      maxAllowed:
        cpu: 200m
        memory: 256Mi
      controlledResources:
      - cpu
      - memory
      controlledValues: RequestsAndLimits

